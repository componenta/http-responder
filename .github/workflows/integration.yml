name: DI 6 and response emission integration

on:
  push:
    branches: [fix/http-response-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/http-emitter
          ref: 73a3d13d7d9f2033cf170e9d73dd1e6b2d72ddff
          path: .audit/http-emitter
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/di
          ref: e203077d12048936f078d37d1cf3badd661e1716
          path: .audit/di
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/validation
          ref: 59abbe8d1388fe9ccc016c12dc12a2de389685f7
          path: .audit/validation
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
          extensions: fileinfo, mbstring, ctype
          tools: composer:2.9.8@sha256:59b2c50e10cafa0d8efc19ede9a326d782f096c674a26baf98cf042ce23de890
      - run: composer validate --working-dir=integration --strict
      - run: composer update --working-dir=integration --no-interaction --prefer-dist --no-progress
      - run: composer audit --working-dir=integration
      - name: Verify both DI discovery strategies and emit the resulting response
        run: |
          set -euo pipefail
          test "$(php integration/smoke.php full)" = '{"ok":true}'
          echo "Full discovery: all integration assertions passed."
          test "$(php integration/smoke.php targeted)" = '{"ok":true}'
          echo "Targeted discovery: all integration assertions passed."
