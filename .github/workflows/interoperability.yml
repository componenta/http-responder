name: Response interoperability (CGI)

on:
  push:
    branches: [fix/http-response-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sapi:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/http-emitter
          ref: 5cb7c204845fc38100961e0d0933b48c892099d8
          path: .audit/http-emitter
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: componenta/mimetype-detector
          ref: 06f55cfe8d4d0d9f865b4d0ac89a87f12ef4d95e
          path: .audit/mimetype-detector
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: fileinfo, mbstring, ctype
          tools: composer:2.9.8@sha256:59b2c50e10cafa0d8efc19ede9a326d782f096c674a26baf98cf042ce23de890
      - name: Require matching CGI executable
        run: |
          binary="$(command -v php-cgi || true)"
          if [ ! -x "$binary" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y "php${{ matrix.php }}-cgi"
            binary="$(command -v php-cgi${{ matrix.php }} || command -v php-cgi)"
          fi
          test -x "$binary"
          "$binary" -v | grep -F "PHP ${{ matrix.php }}."
          echo "PHP_CGI_BINARY=$binary" >> "$GITHUB_ENV"
      - run: composer validate --working-dir=integration/sapi --strict
      - run: composer update --working-dir=integration/sapi --no-interaction --prefer-dist --no-progress
      - run: composer audit --working-dir=integration/sapi
      - run: php integration/sapi/check.php
